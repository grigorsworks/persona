name: Mirror update

# Publishes a Wayzerr update as a GitHub release, so people who cannot reach wayzerr.com
# (for example when an internet provider blocks part of Cloudflare) still receive updates.
# Push a branch named mirror/<version> holding mirror/request.json and the installer cut into
# pieces in mirror/parts/. This workflow joins the pieces, checks the sha256, publishes the release
# (installer + latest.json feed) and deletes the branch.

on:
  push:
    branches: ['mirror/**']

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Join, verify and publish
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          VERSION=$(jq -r .version mirror/request.json)
          BUILD=$(jq -r .build mirror/request.json)
          SHA=$(jq -r .sha256 mirror/request.json)
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::bad version"; exit 1; }
          [[ "$SHA" =~ ^[a-f0-9]{64}$ ]] || { echo "::error::bad sha256"; exit 1; }
          FILE="Wayzerr-$VERSION.dmg"
          cat mirror/parts/part-* > "$FILE"
          echo "$SHA  $FILE" | sha256sum -c - || { echo "::error::sha256 of the joined installer does not match"; exit 1; }
          SIZE=$(stat -c %s "$FILE")
          jq -n --arg v "$VERSION" --arg b "$BUILD" --arg u "https://github.com/$REPO/releases/download/v$VERSION/$FILE" \
                --arg s "$SHA" --argjson z "$SIZE" --slurpfile r mirror/request.json \
             '{version:$v, build:$b, url:$u, sha256:$s, size:$z, notes:$r[0].notes}' > latest.json
          cat latest.json
          if gh release view "v$VERSION" >/dev/null 2>&1; then
            gh release upload "v$VERSION" "$FILE" latest.json --clobber
            gh release edit "v$VERSION" --latest
          else
            gh release create "v$VERSION" "$FILE" latest.json --title "Wayzerr $VERSION" --notes "Mirror of the Wayzerr $VERSION update." --latest
          fi
          git push origin --delete "${GITHUB_REF_NAME}" || true
